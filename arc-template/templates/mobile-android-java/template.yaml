schema_version: "1.0"
id: mobile-android-java
name: Mobile Application (Android + Java)
type: mobile_app
version: 1.0.0
description: Android and Java application template for generation agents.
stack:
  app:
    platform: Android
    language: Java
  build:
    tool: Gradle
  tests:
    unit: JUnit
copy:
  exclude:
    - template.yaml
    - .gradle
    - app/build
    - build
agent_guidance:
  app_root: app/src/main
  source_root: app/src/main/java
  resource_root: app/src/main/res
  test_root: app/src/test
generator_defaults:
  package_name: com.example.template
  main_activity: MainActivity
  replaceable_files:
    - MainActivity.java
    - activity_main.xml
    - AndroidManifest.xml
  configurable_items:
    - package_name
    - app_name
    - activity_name
